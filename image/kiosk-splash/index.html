<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting Gambit</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1d23;
      color: #f5f7fb;
    }

    * {
      box-sizing: border-box;
      caret-color: transparent;
      cursor: none;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(63, 96, 142, 0.24), transparent 34%),
        #1a1d23;
    }

    main {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .text {
      width: min(86vw, 560px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      font-weight: 650;
      letter-spacing: 0;
    }

    p {
      margin: 1.2rem 0 0;
      color: #c6cedc;
      font-size: clamp(1.15rem, 3vw, 1.55rem);
      line-height: 1.45;
    }

    .bar {
      position: relative;
      overflow: hidden;
      width: min(70vw, 380px);
      height: 10px;
      margin: 2.2rem auto 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
    }

    .bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 42%;
      border-radius: inherit;
      background: #7ea4ff;
      animation: loading 1.35s ease-in-out infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(240%); }
    }

    .setup {
      margin-top: 1.6rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    .setup p {
      margin: 0.35rem 0 0;
      font-size: clamp(1rem, 2.6vw, 1.3rem);
    }

    .setup b {
      color: #f5f7fb;
      font-family: ui-monospace, Menlo, monospace;
    }

    .qr {
      width: 160px;
      margin: 0;
      text-align: center;
    }

    .qr img {
      display: block;
      width: 160px;
      height: 160px;
      border-radius: 12px;
    }

    .qr figcaption {
      margin-top: 0.6rem;
      color: #c6cedc;
      font-size: 1rem;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <main>
    <div class="text">
      <h1>Starting Gambit</h1>
      <p id="status">Starting local services...</p>
      <div class="bar" aria-hidden="true"></div>
      <div class="setup" id="setup" hidden>
        <p>Or, from a phone or laptop:</p>
        <p>Join the Wi-Fi <b id="setup-ssid"></b><span id="setup-password-line">, password <b id="setup-password"></b></span></p>
        <p>Then open <b id="setup-address"></b></p>
      </div>
    </div>
    <figure class="qr" id="setup-qr" hidden>
      <img alt="Setup QR code" onerror="this.parentElement.remove()">
      <figcaption>Scan with your iPhone to set up this Gambit</figcaption>
    </figure>
  </main>
  <script>
    const target = new URLSearchParams(window.location.search).get("target") || "http://127.0.0.1:8765/kiosk/help";
    const status = document.getElementById("status");
    const setup = document.getElementById("setup");

    const qr = document.getElementById("setup-qr");
    let qrOn = false; // core's "setup": {"show_qr_code": true}, off by default

    // The setup QR code (GMBT-1470) shows while the device is in setup mode,
    // when the app can reach it over Bluetooth as gambit-setup-<id>.
    function showSetup(network) {
      setup.hidden = !network;
      qr.hidden = !network || !qrOn;
      if (!network) return;
      if (qrOn) qr.querySelector("img").src ||= "/setup-qr.svg";
      document.getElementById("setup-ssid").textContent = network.ssid;
      document.getElementById("setup-password").textContent = network.password;
      document.getElementById("setup-password-line").hidden = !network.password;
      document.getElementById("setup-address").textContent = network.address;
    }

    async function checkReady() {
      try {
        const response = await fetch(`/state?target=${encodeURIComponent(target)}`, { cache: "no-store" });
        const state = await response.json();
        status.textContent = state.message || "Starting Gambit services...";
        qrOn = Boolean(state.qr);
        showSetup(state.setup);
        if (state.ready) {
          window.location.replace(target);
          return;
        }
      } catch (_) {
        status.textContent = "Starting Gambit services...";
      }
      window.setTimeout(checkReady, 2000);
    }

    window.setTimeout(checkReady, 800);
  </script>
</body>
</html>
